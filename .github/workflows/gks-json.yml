name: GKS JSON tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gks-json-tests:
    name: GKS JSON tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements/test.txt

      - name: Run GKS JSON tests
        run: python -m pytest tests/clinvar_this/io/gks_json --no-cov
